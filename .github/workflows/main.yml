name: WiFi Auditor Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android scaffold
        shell: bash
        run: |
          if [[ ! -f android/gradlew || ! -f android/app/build.gradle ]]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/wifi-auditor-AndroidManifest.xml
            rm -rf android
            flutter create --platforms=android --org com.example --project-name wifi_security_auditor .
            sed 's|@mipmap/launcher_icon|@mipmap/ic_launcher|g' \
              /tmp/wifi-auditor-AndroidManifest.xml \
              > android/app/src/main/AndroidManifest.xml
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build AppBundle
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
