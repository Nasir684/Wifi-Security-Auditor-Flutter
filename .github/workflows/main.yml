name: WiFi Auditor Build - Global Monetized

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android scaffold + Patch for AdMob & Icon
        shell: bash
        run: |
          if [[ ! -f android/gradlew || ! -f android/app/build.gradle ]]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/wifi-auditor-AndroidManifest.xml 2>/dev/null || echo "No manifest to backup"
            rm -rf android
            flutter create --platforms=android --org com.wanalab --project-name wifi_security_auditor .
            if [[ -f /tmp/wifi-auditor-AndroidManifest.xml ]]; then
              sed 's|@mipmap/launcher_icon|@mipmap/ic_launcher|g' \
                /tmp/wifi-auditor-AndroidManifest.xml \
                > android/app/src/main/AndroidManifest.xml
            fi
          fi
          
          # --- PATCH 1: Ensure AndroidManifest has AdMob App ID + Permissions ---
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.google.android.gms.permission.AD_ID" "$MANIFEST"; then
            sed -i '/<manifest/a \    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' "$MANIFEST"
          fi
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i '/<application/a \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>' "$MANIFEST"
          fi
          # Replace with your real AdMob App ID before production release

          # --- PATCH 2: Ensure minSdk 21 for google_mobile_ads ---
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk 16/minSdk 21/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion 16/flutter.minSdkVersion 21/g' android/app/build.gradle || true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build AppBundle
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
