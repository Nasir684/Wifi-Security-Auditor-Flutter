name: wifi_security_auditor
description: Ethical WiFi Security Toolkit for Technicians - by WanaLab - Authorized auditing only
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  wifi_scan: ^0.4.3
  permission_handler: ^11.3.1
  pdf: ^3.11.1
  path_provider: ^2.1.2
  share_plus: ^9.0.0
  google_mobile_ads: ^6.0.0
  in_app_purchase: ^3.1.13
  shared_preferences: ^2.2.2
  network_info_plus: ^5.0.1
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#0A0E1A"
    theme_color: "#3B82F6"
