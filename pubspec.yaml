name: wifi_security_auditor
description: WanaLab - WiFi Security Auditor. Scan, detect risks, protect your network. Built in Wana, South Waziristan. Contact: nasir@wanalab.org
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  wifi_scan: ^0.4.1+3
  permission_handler: ^11.3.0
  pdf: ^3.11.1
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  shared_preferences: ^2.2.2
  google_mobile_ads: ^4.0.0
  in_app_purchase: ^3.1.13
  open_file: ^3.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
