name: wifi_security_auditor
description: Ethical WiFi Security Toolkit for Technicians - by WanaLab - Authorized auditing only
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  wifi_scan: ^0.4.1
  permission_handler: ^11.3.0
  pdf: ^3.11.1
  path_provider: ^2.1.2
  share_plus: ^9.0.0
  google_mobile_ads: 5.0.0
  in_app_purchase: ^3.1.13
  shared_preferences: ^2.2.2
  network_info_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  # This workflow builds Android only; omit iOS generation because the repo
  # does not contain ios/Runner/Assets.xcassets/AppIcon.appiconset.
  ios: false
  image_path: "icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#0A0E1A"
    theme_color: "#3B82F6"
